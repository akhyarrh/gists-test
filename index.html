<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gist Akhyarrh</title>
    
    <!-- Konfigurasi Tailwind untuk Dark Mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Mengaktifkan dark mode berbasis class
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',      // Slate 900
                            card: '#1e293b',    // Slate 800
                            border: '#334155',  // Slate 700
                        }
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Transisi halus saat ganti tema */
        body, div, h1, h2, p, a, input { transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
    </style>

    <!-- Script untuk cek preferensi tema user saat awal load -->
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-dark-bg dark:text-gray-200 min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="bg-slate-900 dark:bg-slate-950 text-white pt-10 pb-20 shadow-lg relative overflow-hidden transition-colors duration-500">
        <!-- Tombol Toggle Dark Mode -->
        <div class="absolute top-4 right-4 z-50">
            <button id="theme-toggle" class="bg-white/10 hover:bg-white/20 backdrop-blur-sm text-white px-4 py-2 rounded-full transition focus:outline-none ring-2 ring-transparent focus:ring-blue-400">
                <i id="theme-icon" class="fas fa-moon"></i>
            </button>
        </div>

        <div class="container mx-auto px-4 text-center relative z-10">
            <img id="avatar" src="https://github.com/identicons/akhyarrh.png" alt="Profile" class="w-20 h-20 rounded-full mx-auto border-4 border-slate-700 shadow-xl mb-4 bg-slate-800">
            
            <h1 class="text-3xl font-bold mb-2">
                Gist 
                <a href="https://github.com/akhyarrh" target="_blank" class="text-blue-400 hover:text-blue-300 hover:underline decoration-2 underline-offset-4 transition-all">
                    @akhyarrh
                </a>
            </h1>
            
            <!-- Search Input -->
            <div class="max-w-md mx-auto mt-6 relative">
                <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
                <input type="text" id="filterInput" placeholder="Cari deskripsi gist..." 
                    class="w-full pl-10 pr-4 py-3 rounded-full 
                           bg-white text-gray-800 
                           dark:bg-slate-800 dark:text-white dark:placeholder-gray-500
                           focus:outline-none focus:ring-4 focus:ring-blue-500/50 shadow-lg border-none transition-colors"
                    onkeyup="filterGists()">
            </div>
        </div>
        
        <div class="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 -mt-10 pb-10 flex-grow z-20 relative">
        
        <!-- Status Message -->
        <div id="status-message" class="text-center bg-white dark:bg-slate-800 p-6 rounded-lg shadow-md max-w-lg mx-auto mb-6">
            <i class="fas fa-circle-notch fa-spin text-4xl text-blue-500 mb-3"></i>
            <p class="text-gray-600 dark:text-gray-300">Memuat data...</p>
        </div>

        <!-- Gist Grid Container -->
        <div id="gist-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Items akan dirender di sini via JS -->
        </div>

    </main>

    <footer class="text-center py-6 text-gray-400 text-sm border-t border-gray-200 dark:border-slate-800 bg-white dark:bg-slate-950 transition-colors">
        &copy; <script>document.write(new Date().getFullYear())</script> Akhyarrh | Vanilla JS Gist Viewer
    </footer>

    <script>
        // --- LOGIC DARK MODE ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;

        // Set icon awal
        if (html.classList.contains('dark')) {
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }

        themeToggleBtn.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            }
        });

        // --- LOGIC GIST (SAMA SEPERTI SEBELUMNYA + DARK STYLE) ---
        
        const config = {
            username: 'akhyarrh',
            limit: 100
        };

        let allGistsData = [];

        function gistsApiUrl(username, limit = 100) {
            return `https://api.github.com/users/${username}/gists?per_page=${limit}`;
        }

        async function fetchGists() {
            const statusDiv = document.getElementById('status-message');
            const url = gistsApiUrl(config.username, config.limit);

            fetch(`https://api.github.com/users/${config.username}`).then(r=>r.json()).then(u => {
                if(u.avatar_url) document.getElementById('avatar').src = u.avatar_url;
            });

            try {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`HTTP error: ${resp.status}`);
                
                let data = await resp.json();

                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error("Tidak ada gists publik ditemukan.");
                }

                // Sorting: Newest First
                data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                allGistsData = data; 
                renderGists(allGistsData);
                
                statusDiv.classList.add('hidden');

            } catch (err) {
                console.error(err);
                statusDiv.innerHTML = `
                    <div class="text-red-500">
                        <i class="fas fa-exclamation-triangle text-3xl mb-2"></i>
                        <p class="font-bold">Gagal memuat data</p>
                        <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">${err.message}</p>
                    </div>
                `;
            }
        }

        function renderGists(gists) {
            const container = document.getElementById('gist-container');
            container.innerHTML = ''; 

            if (gists.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-gray-500 dark:text-gray-400 py-10">Tidak ada hasil yang cocok.</p>`;
                return;
            }

            gists.forEach(gist => {
                const firstFileName = Object.keys(gist.files)[0];
                const fileData = gist.files[firstFileName];
                const language = fileData.language || 'Text';
                const rawDesc = gist.description || firstFileName; 
                
                const createdDate = new Date(gist.created_at).toLocaleDateString('id-ID', {
                    day: 'numeric', month: 'short', year: 'numeric'
                });
                const updatedDateObj = new Date(gist.updated_at);
                const updatedDate = updatedDateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

                // Logic Warna Badge (Support Dark Mode)
                let langColor = 'bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300';
                
                if (language === 'JavaScript') langColor = 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/40 dark:text-yellow-200';
                if (language === 'Python') langColor = 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-200';
                if (language === 'HTML') langColor = 'bg-orange-100 text-orange-700 dark:bg-orange-900/40 dark:text-orange-200';
                if (language === 'CSS') langColor = 'bg-indigo-100 text-indigo-700 dark:bg-indigo-900/40 dark:text-indigo-200';
                if (language === 'PHP') langColor = 'bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-200';

                // Kartu dengan class Dark Mode (dark:...)
                const cardHtml = `
                <div class="bg-white dark:bg-dark-card rounded-lg shadow-sm hover:shadow-md transition duration-300 border border-gray-200 dark:border-dark-border flex flex-col fade-in">
                    <div class="p-5 flex-grow">
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-semibold px-2 py-1 rounded ${langColor}">
                                ${language}
                            </span>
                            <div class="text-xs text-gray-400 text-right">
                                <div title="Dibuat"><i class="far fa-calendar-plus mr-1"></i>${createdDate}</div>
                            </div>
                        </div>

                        <h2 class="text-lg font-bold leading-tight mb-2">
                            <a href="${gist.html_url}" target="_blank" class="text-gray-800 dark:text-gray-100 hover:text-blue-600 dark:hover:text-blue-400 hover:underline decoration-2 underline-offset-2 transition-colors">
                                ${rawDesc}
                            </a>
                        </h2>

                        <div class="text-xs text-gray-500 dark:text-gray-400 font-mono truncate mt-2 bg-gray-50 dark:bg-slate-900/50 p-1.5 rounded border border-transparent dark:border-slate-700">
                            <i class="far fa-file-code mr-1"></i> ${firstFileName}
                        </div>
                    </div>

                    <div class="bg-gray-50 dark:bg-slate-900/30 px-5 py-3 border-t border-gray-100 dark:border-dark-border flex justify-between items-center text-xs text-gray-500 dark:text-gray-400">
                        <span title="Terakhir diupdate">
                            <i class="fas fa-history mr-1"></i> ${updatedDate}
                        </span>
                        <span title="Total Files" class="font-medium">
                            <i class="far fa-copy mr-1"></i> ${Object.keys(gist.files).length} File
                        </span>
                    </div>
                </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        function filterGists() {
            const filterValue = document.getElementById('filterInput').value.toLowerCase();
            const filteredData = allGistsData.filter(gist => {
                const desc = (gist.description || "").toLowerCase();
                const fileName = Object.keys(gist.files)[0].toLowerCase();
                return desc.indexOf(filterValue) !== -1 || fileName.indexOf(filterValue) !== -1;
            });
            renderGists(filteredData);
        }

        fetchGists();
    </script>
</body>
</html>
